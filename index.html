<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SiteSnap</title>
  <meta name="description" content="Document site visits with photos and comments, then share a professional PDF report. Works offline. No account, no tracking.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SiteSnap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font:18px sans-serif">SiteSnap needs JavaScript. Please turn it on in your browser settings.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
